name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # pnpm install 的 postinstall 会自动 bootstrap 前置产物
      # （icons dist + theme.scss），无需在此单独构建。
      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm --filter @vaebe/ccui test

  e2e-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check E2E coverage
        run: pnpm check:e2e-coverage

  e2e:
    needs: e2e-coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @vaebe/ccui-e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @vaebe/ccui-e2e exec playwright test --shard=${{ matrix.shard }}/4 --reporter=blob

      - name: Upload E2E shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: packages/e2e/blob-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e-report:
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shard reports
        uses: actions/download-artifact@v5
        with:
          pattern: playwright-blob-*
          path: packages/e2e/all-blob-reports
          merge-multiple: true

      - name: Merge Playwright report
        run: pnpm --filter @vaebe/ccui-e2e exec playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload merged E2E report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          if-no-files-found: error
          retention-days: 7
