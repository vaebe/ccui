packages:
  - 'packages/*'
  - 'examples/*'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.1.20
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.20
  vite-plus: 0.1.20
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  baseline-browser-mapping: 2.10.43
  # 防止双 vue 实例（3.5.22 + 3.5.33）破坏组件库测试中的 reactivity 追踪。
  # docs/vitepress 生态吃 3.5.33，统一锚定到该版本；ccui 的 ^3.5.22 兼容。
  vue: 3.5.33
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
